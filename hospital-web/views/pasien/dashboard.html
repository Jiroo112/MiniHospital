<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pasien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/pasien.css" rel="stylesheet">
    <link href="../../css/pasien-dashboard.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">

    <!-- Welcome Banner -->
    <div class="welcome-banner">
        <h4>Halo, <span id="userName">Pasien</span>! 👋</h4>
        <p id="tanggalHariIni"></p>
    </div>

    <div class="row g-4">

        <!-- Antrian Aktif -->
        <div class="col-lg-7">
            <div class="section-card mb-0">
                <div class="section-header">
                    <h6 class="section-title">🏥 Status Antrian Hari Ini</h6>
                </div>
                <div class="p-3" id="cardAntrian">
                    <div class="text-center py-4 text-muted">Memuat antrian...</div>
                </div>
            </div>
        </div>

        <!-- Menu Cepat -->
        <div class="col-lg-5">
            <div class="section-card">
                <div class="section-header">
                    <h6 class="section-title">⚡ Menu Cepat</h6>
                </div>
                <div class="quick-menu">
                    <a href="booking.html" class="quick-btn quick-btn-booking">
                        <span class="btn-icon">📋</span>
                        <div>
                            <div>Booking Antrian</div>
                            <div style="font-size:0.75rem;opacity:0.7;font-weight:400">Daftar ke dokter pilihan</div>
                        </div>
                    </a>
                    <a href="antrian.html" class="quick-btn quick-btn-antrian">
                        <span class="btn-icon">⏳</span>
                        <div>
                            <div>Antrian Saya</div>
                            <div style="font-size:0.75rem;opacity:0.7;font-weight:400">Cek status antrian hari ini</div>
                        </div>
                    </a>
                    <a href="riwayat.html" class="quick-btn quick-btn-riwayat">
                        <span class="btn-icon">📂</span>
                        <div>
                            <div>Riwayat Kunjungan</div>
                            <div style="font-size:0.75rem;opacity:0.7;font-weight:400">Lihat rekam medis & booking</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/dashboard-pasien.js"></script>

</body>
</html>
