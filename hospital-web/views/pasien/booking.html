<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Antrian - Pasien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/pasien.css" rel="stylesheet">
    <link href="../../css/pasien-booking.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">

    <div class="page-header">
        <h4>Booking Antrian Baru</h4>
        <p>Pilih poli dan dokter untuk kunjungan Anda</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div id="hasilBooking"></div>

            <div class="booking-card" id="formCard">
                <div class="booking-card-header">
                    <h6>📋 Pilih Poli dan Dokter</h6>
                </div>
                <div class="booking-body">
                    <form id="formBooking">

                        <div class="mb-3">
                            <label class="form-label">Poli</label>
                            <select name="poli_id" class="form-select" required>
                                <option value="">-- Pilih Poli --</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dokter</label>
                            <select name="dokter_id" class="form-select" required disabled>
                                <option value="">-- Pilih poli dulu --</option>
                            </select>
                            <div id="jadwalInfo"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Tanggal Kunjungan</label>
                            <input type="date" name="tanggal" class="form-control" required>
                            <div style="font-size:0.78rem;color:#94a3b8;margin-top:4px">
                                Tidak bisa pilih tanggal masa lalu
                            </div>
                        </div>

                        <button type="submit" class="btn-booking" id="btnBooking">
                            Booking Sekarang
                        </button>

                    </form>

                    <div class="catatan-box">
                        ⚠️ <strong>Catatan:</strong> Anda hanya bisa punya 1 antrian aktif per hari.
                        Selesaikan atau batalkan booking lama dulu sebelum booking baru di tanggal yang sama.
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/pasien-booking.js"></script>

</body>
</html>
