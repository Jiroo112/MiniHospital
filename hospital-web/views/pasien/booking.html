<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Booking Antrian - Pasien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="navbar"></div>

<div class="container">
    <h3 class="mb-3">Booking Antrian Baru</h3>

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div id="hasilBooking"></div>

            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    Pilih Poli dan Dokter
                </div>
                <div class="card-body" id="formCardBody">
                    <form id="formBooking">

                        <div class="mb-3">
                            <label class="form-label">Poli</label>
                            <select name="poli_id" class="form-select" required>
                                <option value="">-- Pilih Poli --</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dokter</label>
                            <select name="dokter_id" class="form-select" required disabled>
                                <option value="">-- Pilih poli dulu --</option>
                            </select>
                        </div>

                        <div id="jadwalInfo" class="mb-3"></div>

                        <div class="mb-3">
                            <label class="form-label">Tanggal Kunjungan</label>
                            <input type="date" name="tanggal" class="form-control" required>
                            <small class="text-muted">Tidak bisa pilih tanggal masa lalu</small>
                        </div>

                        <button type="submit" class="btn btn-info text-white w-100" id="btnBooking">
                            Booking Sekarang
                        </button>
                    </form>
                </div>
            </div>

            <div class="alert alert-light mt-3">
                <small>
                    <strong>Catatan:</strong> Anda hanya bisa punya 1 antrian aktif per hari.
                    Selesaikan atau batalkan booking lama dulu sebelum booking baru di tanggal yang sama.
                </small>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/pasien-booking.js"></script>

</body>
</html>
