<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Riwayat - Pasien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="navbar"></div>

<div class="container">
    <h3 class="mb-3">Riwayat Saya</h3>

    <ul class="nav nav-tabs mb-3" id="tabRiwayat">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabBooking">
                Riwayat Booking <span class="badge bg-secondary" id="totalBooking">0</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabRekamMedis">
                Rekam Medis <span class="badge bg-secondary" id="totalRekamMedis">0</span>
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Tab Booking -->
        <div class="tab-pane fade show active" id="tabBooking">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th width="50">No</th>
                                    <th>Tanggal</th>
                                    <th width="100">No. Antrian</th>
                                    <th>Dokter</th>
                                    <th>Poli</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="bookingBody">
                                <tr><td colspan="6" class="text-center">Memuat...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Rekam Medis -->
        <div class="tab-pane fade" id="tabRekamMedis">
            <div id="rekamMedisList">
                <div class="text-center py-4">Memuat...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/pasien-riwayat.js"></script>

</body>
</html>
