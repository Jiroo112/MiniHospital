<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Poli — MiniHospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root{--primary:#2563EB;--primary-light:#EFF6FF;--primary-mid:#DBEAFE;--success:#16A34A;--success-light:#F0FDF4;--warning:#D97706;--warning-light:#FFFBEB;--danger:#DC2626;--danger-light:#FEF2F2;--surface:#FFFFFF;--surface-2:#F8FAFC;--border:#E2E8F0;--text-primary:#0F172A;--text-secondary:#64748B;--text-muted:#94A3B8;--shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.10);--radius:14px;--radius-sm:8px}
        *,*::before,*::after{box-sizing:border-box}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface-2);color:var(--text-primary);min-height:100vh}
        .mh-navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
        .brand{font-size:1.05rem;font-weight:800;color:var(--primary);letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;text-decoration:none}
        .brand-icon{width:34px;height:34px;background:var(--primary);border-radius:9px;display:grid;place-items:center;color:#fff;font-size:1rem}
        .mh-nav-links{display:flex;align-items:center;gap:2px;margin-left:2rem}
        .mh-nav-links a{font-size:0.875rem;font-weight:500;color:var(--text-secondary);text-decoration:none;padding:6px 14px;border-radius:8px;transition:all 0.15s;white-space:nowrap}
        .mh-nav-links a:hover{background:var(--surface-2);color:var(--text-primary)}
        .mh-nav-links a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
        .mh-nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
        .nav-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--primary) 0%,#60A5FA 100%);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:0.8rem;font-weight:700}
        .nav-user-name{font-size:0.875rem;font-weight:600}
        .btn-logout{font-size:0.8rem;font-weight:600;color:var(--text-secondary);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 14px;cursor:pointer;transition:all 0.15s}
        .btn-logout:hover{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}
        .page-wrapper{max-width:1000px;margin:0 auto;padding:2rem 1.5rem}
        .page-header{margin-bottom:1.5rem}
        .page-header h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;margin:0}
        .page-header p{color:var(--text-secondary);font-size:0.875rem;margin:4px 0 0}
        .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;flex-wrap:wrap}
        .search-wrap{position:relative;flex:1;min-width:200px;max-width:300px}
        .search-wrap input{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 38px;font-size:0.875rem;font-family:inherit;outline:none;background:var(--surface);transition:border-color 0.15s}
        .search-wrap input:focus{border-color:var(--primary)}
        .search-wrap .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
        .btn-primary-mh{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:0.875rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s}
        .btn-primary-mh:hover{background:#1D4ED8;box-shadow:0 4px 12px rgba(37,99,235,0.35)}

        /* Grid cards for poli */
        .poli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
        .poli-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow-sm);transition:all 0.2s;position:relative;overflow:hidden}
        .poli-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),#60A5FA)}
        .poli-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
        .poli-card-icon{width:48px;height:48px;background:var(--primary-light);border-radius:12px;display:grid;place-items:center;color:var(--primary);font-size:1.4rem;margin-bottom:1rem}
        .poli-card-name{font-size:1rem;font-weight:800;color:var(--text-primary);margin-bottom:4px}
        .poli-card-loc{font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center;gap:5px;margin-bottom:1rem}
        .poli-card-actions{display:flex;gap:8px}
        .btn-action{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:8px;font-size:0.78rem;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all 0.15s}
        .btn-edit{background:var(--warning-light);color:var(--warning)}
        .btn-edit:hover{background:#FDE68A}
        .btn-del{background:var(--danger-light);color:var(--danger)}
        .btn-del:hover{background:#FECACA}

        .mh-modal .modal-content{border:none;border-radius:var(--radius);box-shadow:var(--shadow-lg)}
        .mh-modal .modal-header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.25rem 1.5rem}
        .mh-modal .modal-header h5{font-weight:800;font-size:1rem;margin:0}
        .mh-modal .modal-body{padding:1.5rem}
        .mh-modal .modal-footer{border-top:1px solid var(--border);padding:1rem 1.5rem;gap:10px}
        .form-label{font-size:0.8rem;font-weight:700;color:var(--text-secondary);margin-bottom:5px}
        .form-control{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:0.875rem;font-family:inherit;outline:none;transition:border-color 0.15s;width:100%}
        .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
        .mh-alert{padding:12px 16px;border-radius:10px;font-size:0.875rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:10px}
        .mh-alert.success{background:var(--success-light);color:var(--success);border:1px solid #BBF7D0}
        .mh-alert.error{background:var(--danger-light);color:var(--danger);border:1px solid #FECACA}
        .empty-state{text-align:center;padding:4rem 1rem;color:var(--text-muted)}
        .empty-state i{font-size:3rem;display:block;margin-bottom:1rem;opacity:0.25}

        /* Poli icon colors cycling */
        .poli-card:nth-child(2n) .poli-card-icon{background:var(--success-light);color:var(--success)}
        .poli-card:nth-child(3n) .poli-card-icon{background:var(--warning-light);color:var(--warning)}
        .poli-card:nth-child(2n) .poli-card::before{background:linear-gradient(90deg,var(--success),#4ADE80)}

        @media(max-width:768px){.mh-nav-links{display:none}.page-wrapper{padding:1.25rem 1rem}}
    </style>
</head>
<body>

<nav class="mh-navbar">
    <a href="dashboard.html" class="brand">
        <span class="brand-icon"><i class="bi bi-hospital"></i></span>
        MiniHospital
    </a>
    <div class="mh-nav-links" id="navLinks"></div>
    <div class="mh-nav-right">
        <div class="nav-avatar" id="navAvatar">A</div>
        <span class="nav-user-name" id="navUserName">Admin</span>
        <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header">
        <h1><i class="bi bi-building-fill-cross me-2" style="color:var(--primary)"></i>Manajemen Poli</h1>
        <p>Kelola poli klinik yang tersedia di rumah sakit</p>
    </div>

    <div class="toolbar">
        <div class="search-wrap">
            <i class="bi bi-search si"></i>
            <input type="text" id="searchInput" placeholder="Cari nama poli...">
        </div>
        <button class="btn-primary-mh" id="btnTambah">
            <i class="bi bi-plus-circle-fill"></i> Tambah Poli
        </button>
    </div>

    <div id="alertBox"></div>
    <div class="poli-grid" id="poliGrid">
        <div style="color:var(--text-muted);padding:2rem">Memuat data poli...</div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade mh-modal" id="poliModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formPoli">
                <div class="modal-header">
                    <h5 id="modalTitle">Tambah Poli</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <div class="mb-3">
                        <label class="form-label">Nama Poli *</label>
                        <input type="text" name="nama_poli" class="form-control" placeholder="Contoh: Poli Umum" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lokasi</label>
                        <input type="text" name="lokasi" class="form-control" placeholder="Contoh: Lantai 1, Gedung A">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn-primary-mh"><i class="bi bi-save me-1"></i>Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script>
const NAV_MENU=[{href:'dashboard.html',label:'Dashboard',key:'dashboard',icon:'bi-speedometer2'},{href:'poli.html',label:'Poli',key:'poli',icon:'bi-building-fill-cross'},{href:'doctors.html',label:'Dokter',key:'doctors',icon:'bi-person-badge'},{href:'schedules.html',label:'Jadwal',key:'schedules',icon:'bi-calendar-week'},{href:'queues.html',label:'Antrian',key:'queues',icon:'bi-list-ol'}];
const BASE_PATH='/MiniHospital/hospital-web/views/admin/';
const ACTIVE_PAGE='poli';
function buildNav(){document.getElementById('navLinks').innerHTML=NAV_MENU.map(m=>`<a href="${BASE_PATH}${m.href}" class="${m.key===ACTIVE_PAGE?'active':''}"><i class="bi ${m.icon} me-1"></i>${m.label}</a>`).join('')}
function setUserInfo(){const u=getUser();if(!u)return;document.getElementById('navUserName').textContent=u.name;document.getElementById('navAvatar').textContent=(u.name?.split(' ').map(w=>w[0]).join('').toUpperCase()||'A').substring(0,2)}
function showAlert(type,msg){document.getElementById('alertBox').innerHTML=`<div class="mh-alert ${type}"><i class="bi ${type==='success'?'bi-check-circle-fill':'bi-x-circle-fill'}"></i>${msg}</div>`;setTimeout(()=>document.getElementById('alertBox').innerHTML='',4000)}
window.injectNavbar=()=>{};
window.showAlert=(target,type,message)=>showAlert(type==='success'?'success':'error',message);

requireRole('admin');
buildNav();
setUserInfo();

const POLI_ICONS=['bi-heart-pulse','bi-eye','bi-lungs','bi-capsule','bi-person-arms-up','bi-droplet-half','bi-bandaid','bi-clipboard2-pulse','bi-thermometer-half'];

function loadPoli(){
    apiCall('/poli','GET').done(function(res){
        if(!res.data||!res.data.length){
            document.getElementById('poliGrid').innerHTML=`<div class="empty-state" style="grid-column:1/-1"><i class="bi bi-building-fill-cross"></i><p>Belum ada data poli</p></div>`;
            return;
        }
        const cards=res.data.map((p,i)=>`
            <div class="poli-card" data-name="${p.nama_poli.toLowerCase()}">
                <div class="poli-card-icon"><i class="bi ${POLI_ICONS[i%POLI_ICONS.length]}"></i></div>
                <div class="poli-card-name">${p.nama_poli}</div>
                <div class="poli-card-loc"><i class="bi bi-geo-alt"></i>${p.lokasi||'Lokasi belum diatur'}</div>
                <div class="poli-card-actions">
                    <button class="btn-action btn-edit" onclick="openEditModal(${p.id})"><i class="bi bi-pencil"></i> Edit</button>
                    <button class="btn-action btn-del" onclick="hapusPoli(${p.id},'${p.nama_poli}')"><i class="bi bi-trash"></i> Hapus</button>
                </div>
            </div>`).join('');
        document.getElementById('poliGrid').innerHTML=cards;
    });
}

function openCreateModal(){document.getElementById('modalTitle').textContent='Tambah Poli';document.getElementById('formPoli').reset();document.querySelector('input[name=id]').value='';new bootstrap.Modal(document.getElementById('poliModal')).show()}
function openEditModal(id){
    apiCall(`/poli/${id}`,'GET').done(function(res){
        if(!res.status||!res.data)return;
        document.getElementById('modalTitle').textContent='Edit Poli';
        document.querySelector('input[name=id]').value=res.data.id;
        document.querySelector('input[name=nama_poli]').value=res.data.nama_poli;
        document.querySelector('input[name=lokasi]').value=res.data.lokasi||'';
        new bootstrap.Modal(document.getElementById('poliModal')).show();
    });
}
function hapusPoli(id,nama){
    if(!confirm(`Yakin hapus poli "${nama}"?`))return;
    apiCall(`/poli/${id}`,'DELETE').done(res=>{showAlert('success',res.message);loadPoli()}).fail(xhr=>showAlert('error',xhr.responseJSON?.message||'Gagal menghapus'));
}
document.getElementById('btnTambah').onclick=openCreateModal;
document.getElementById('formPoli').onsubmit=function(e){
    e.preventDefault();
    const id=document.querySelector('input[name=id]').value;
    const data={nama_poli:document.querySelector('input[name=nama_poli]').value,lokasi:document.querySelector('input[name=lokasi]').value};
    apiCall(id?`/poli/${id}`:'/poli',id?'PUT':'POST',data).done(res=>{bootstrap.Modal.getInstance(document.getElementById('poliModal')).hide();showAlert('success',res.message);loadPoli()}).fail(xhr=>showAlert('error',xhr.responseJSON?.message||'Gagal menyimpan'));
};
document.getElementById('searchInput').oninput=function(){
    const q=this.value.toLowerCase();
    document.querySelectorAll('.poli-card').forEach(c=>c.style.display=c.dataset.name.includes(q)?'':'none');
};

loadPoli();
</script>
</body>
</html>
