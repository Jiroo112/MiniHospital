<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Poli — MiniHospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/admin.css" rel="stylesheet">
    <link href="../../css/admin-poli.css" rel="stylesheet">
</head>
<body>

<nav class="mh-navbar">
    <a href="dashboard.html" class="brand">
        <span class="brand-icon"><i class="bi bi-hospital"></i></span>
        MiniHospital
    </a>
    <div class="mh-nav-links" id="navLinks"></div>
    <div class="mh-nav-right">
        <div class="nav-avatar" id="navAvatar">A</div>
        <span class="nav-user-name" id="navUserName">Admin</span>
        <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header">
        <h1><i class="bi bi-building-fill-cross me-2 icon-primary"></i>Manajemen Poli</h1>
        <p>Kelola poli klinik yang tersedia di rumah sakit</p>
    </div>

    <div class="toolbar">
        <div class="search-wrap">
            <i class="bi bi-search si"></i>
            <input type="text" id="searchInput" placeholder="Cari nama poli...">
        </div>
        <button class="btn-primary-mh" id="btnTambah">
            <i class="bi bi-plus-circle-fill"></i> Tambah Poli
        </button>
    </div>

    <div id="alertBox"></div>
    <div class="poli-grid" id="poliGrid">
        <div style="color:var(--text-muted);padding:2rem">Memuat data poli...</div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade mh-modal" id="poliModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formPoli">
                <div class="modal-header">
                    <h5 id="modalTitle">Tambah Poli</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <div class="mb-3">
                        <label class="form-label">Nama Poli *</label>
                        <input type="text" name="nama_poli" class="form-control" placeholder="Contoh: Poli Umum" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lokasi</label>
                        <input type="text" name="lokasi" class="form-control" placeholder="Contoh: Lantai 1, Gedung A">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn-primary-mh"><i class="bi bi-save me-1"></i>Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/pages/admin-poli.js"></script>
</body>
</html>
