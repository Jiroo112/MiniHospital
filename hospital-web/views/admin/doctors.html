<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Dokter — MiniHospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary:#2563EB;--primary-light:#EFF6FF;--primary-mid:#DBEAFE;
            --success:#16A34A;--success-light:#F0FDF4;
            --warning:#D97706;--warning-light:#FFFBEB;
            --danger:#DC2626;--danger-light:#FEF2F2;
            --surface:#FFFFFF;--surface-2:#F8FAFC;
            --border:#E2E8F0;
            --text-primary:#0F172A;--text-secondary:#64748B;--text-muted:#94A3B8;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
            --shadow-md:0 4px 16px rgba(0,0,0,0.08);
            --radius:14px;--radius-sm:8px;
        }
        *,*::before,*::after{box-sizing:border-box}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface-2);color:var(--text-primary);min-height:100vh}

        /* NAVBAR */
        .mh-navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
        .brand{font-size:1.05rem;font-weight:800;color:var(--primary);letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
        .brand-icon{width:34px;height:34px;background:var(--primary);border-radius:9px;display:grid;place-items:center;color:#fff;font-size:1rem}
        .mh-nav-links{display:flex;align-items:center;gap:2px;margin-left:2rem}
        .mh-nav-links a{font-size:0.875rem;font-weight:500;color:var(--text-secondary);text-decoration:none;padding:6px 14px;border-radius:8px;transition:all 0.15s;white-space:nowrap}
        .mh-nav-links a:hover{background:var(--surface-2);color:var(--text-primary)}
        .mh-nav-links a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
        .mh-nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
        .nav-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--primary) 0%,#60A5FA 100%);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:0.8rem;font-weight:700}
        .nav-user-name{font-size:0.875rem;font-weight:600;color:var(--text-primary)}
        .btn-logout{font-size:0.8rem;font-weight:600;color:var(--text-secondary);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 14px;cursor:pointer;transition:all 0.15s}
        .btn-logout:hover{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}

        /* LAYOUT */
        .page-wrapper{max-width:1280px;margin:0 auto;padding:2rem 1.5rem}
        .page-header{margin-bottom:1.5rem}
        .page-header h1{font-size:1.6rem;font-weight:800;color:var(--text-primary);letter-spacing:-0.03em;margin:0}
        .page-header p{color:var(--text-secondary);font-size:0.875rem;margin:4px 0 0}

        /* TOOLBAR */
        .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;flex-wrap:wrap}
        .search-wrap{position:relative;flex:1;min-width:220px;max-width:360px}
        .search-wrap input{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 38px;font-size:0.875rem;font-family:inherit;outline:none;background:var(--surface);transition:border-color 0.15s}
        .search-wrap input:focus{border-color:var(--primary)}
        .search-wrap .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem}
        .btn-primary-mh{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:0.875rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s}
        .btn-primary-mh:hover{background:#1D4ED8;box-shadow:0 4px 12px rgba(37,99,235,0.35)}

        /* CARD + TABLE */
        .mh-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
        .mh-table{width:100%;border-collapse:collapse}
        .mh-table thead th{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:0.7rem 1rem;background:var(--surface-2);border-bottom:1px solid var(--border);text-align:left}
        .mh-table tbody td{padding:1rem;font-size:0.875rem;color:var(--text-primary);border-bottom:1px solid #F1F5F9;vertical-align:middle}
        .mh-table tbody tr:last-child td{border-bottom:none}
        .mh-table tbody tr:hover td{background:#F8FBFF}

        /* DOCTOR AVATAR */
        .doc-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#60A5FA,#2563EB);display:grid;place-items:center;color:#fff;font-size:0.8rem;font-weight:700;flex-shrink:0}
        .doc-name{font-weight:600;font-size:0.875rem}
        .doc-email{font-size:0.78rem;color:var(--text-muted)}

        /* BADGE */
        .spec-badge{display:inline-block;padding:3px 10px;border-radius:6px;background:var(--primary-light);color:var(--primary);font-size:0.75rem;font-weight:700}
        .poli-badge{display:inline-block;padding:3px 10px;border-radius:6px;background:var(--success-light);color:var(--success);font-size:0.75rem;font-weight:700}

        /* ACTION BUTTONS */
        .btn-action{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:7px;font-size:0.78rem;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all 0.15s}
        .btn-edit{background:var(--warning-light);color:var(--warning)}
        .btn-edit:hover{background:#FDE68A}
        .btn-del{background:var(--danger-light);color:var(--danger)}
        .btn-del:hover{background:#FECACA}

        /* MODAL */
        .mh-modal .modal-content{border:none;border-radius:var(--radius);box-shadow:var(--shadow-lg)}
        .mh-modal .modal-header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.25rem 1.5rem;border-radius:var(--radius) var(--radius) 0 0}
        .mh-modal .modal-header h5{font-weight:800;font-size:1rem;margin:0}
        .mh-modal .modal-body{padding:1.5rem}
        .mh-modal .modal-footer{border-top:1px solid var(--border);padding:1rem 1.5rem;gap:10px}
        .form-label{font-size:0.8rem;font-weight:700;color:var(--text-secondary);margin-bottom:5px}
        .form-control,.form-select{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:0.875rem;font-family:inherit;outline:none;transition:border-color 0.15s}
        .form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}

        /* ALERT */
        .mh-alert{padding:12px 16px;border-radius:10px;font-size:0.875rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:10px}
        .mh-alert.success{background:var(--success-light);color:var(--success);border:1px solid #BBF7D0}
        .mh-alert.error{background:var(--danger-light);color:var(--danger);border:1px solid #FECACA}

        .empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
        .empty-state i{font-size:2.5rem;margin-bottom:1rem;display:block;opacity:0.3}

        @media(max-width:768px){.mh-nav-links{display:none}.page-wrapper{padding:1.25rem 1rem}}
    </style>
</head>
<body>

<nav class="mh-navbar">
    <a href="dashboard.html" class="brand">
        <span class="brand-icon"><i class="bi bi-hospital"></i></span>
        MiniHospital
    </a>
    <div class="mh-nav-links" id="navLinks"></div>
    <div class="mh-nav-right">
        <div class="nav-avatar" id="navAvatar">A</div>
        <span class="nav-user-name" id="navUserName">Admin</span>
        <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header">
        <h1><i class="bi bi-person-badge me-2" style="color:var(--primary)"></i>Manajemen Dokter</h1>
        <p>Kelola data dokter yang terdaftar di sistem</p>
    </div>

    <div class="toolbar">
        <div class="search-wrap">
            <i class="bi bi-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Cari nama dokter, spesialis...">
        </div>
        <button class="btn-primary-mh" id="btnTambah">
            <i class="bi bi-plus-circle-fill"></i> Tambah Dokter
        </button>
    </div>

    <div id="alertBox"></div>

    <div class="mh-card">
        <div style="overflow-x:auto">
            <table class="mh-table">
                <thead>
                    <tr>
                        <th width="44">No</th>
                        <th>Dokter</th>
                        <th>Spesialis</th>
                        <th>Poli</th>
                        <th>No HP</th>
                        <th width="160">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted)">Memuat...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade mh-modal" id="doctorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="formDoctor">
                <div class="modal-header">
                    <h5 id="modalTitle">Tambah Dokter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nama Lengkap *</label>
                            <input type="text" name="name" class="form-control" placeholder="dr. Nama Dokter" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" placeholder="email@domain.com" required>
                            <small style="color:var(--text-muted);font-size:0.75rem">Email tidak bisa diubah setelah dibuat</small>
                        </div>
                        <div class="col-12" id="passwordGroup">
                            <label class="form-label">Password *</label>
                            <input type="password" name="password" class="form-control" placeholder="Minimal 6 karakter" minlength="6">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Spesialis</label>
                            <input type="text" name="spesialis" class="form-control" placeholder="Contoh: Penyakit Dalam">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">No HP</label>
                            <input type="text" name="no_hp" class="form-control" placeholder="08xxx">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Poli *</label>
                            <select name="poli_id" class="form-select" required>
                                <option value="">-- Pilih Poli --</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn-primary-mh"><i class="bi bi-save me-1"></i>Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/pages/admin-doctors.js"></script>
<script>
const NAV_MENU = [
    {href:'dashboard.html',label:'Dashboard',key:'dashboard',icon:'bi-speedometer2'},
    {href:'poli.html',label:'Poli',key:'poli',icon:'bi-building-fill-cross'},
    {href:'doctors.html',label:'Dokter',key:'doctors',icon:'bi-person-badge'},
    {href:'schedules.html',label:'Jadwal',key:'schedules',icon:'bi-calendar-week'},
    {href:'queues.html',label:'Antrian',key:'queues',icon:'bi-list-ol'}
];
const BASE_PATH='/MiniHospital/hospital-web/views/admin/';
const ACTIVE_PAGE='doctors';
function buildNav(){
    document.getElementById('navLinks').innerHTML=NAV_MENU.map(m=>{
        const a=m.key===ACTIVE_PAGE?'active':'';
        return`<a href="${BASE_PATH}${m.href}" class="${a}"><i class="bi ${m.icon} me-1"></i>${m.label}</a>`;
    }).join('');
}
function setUserInfo(){
    const u=getUser();if(!u)return;
    document.getElementById('navUserName').textContent=u.name;
    document.getElementById('navAvatar').textContent=(u.name?.split(' ').map(w=>w[0]).join('').toUpperCase()||'A').substring(0,2);
}
function showAlert(type, msg){
    const icon = type==='success'?'bi-check-circle-fill':'bi-x-circle-fill';
    document.getElementById('alertBox').innerHTML=`<div class="mh-alert ${type}"><i class="bi ${icon}"></i>${msg}</div>`;
    setTimeout(()=>document.getElementById('alertBox').innerHTML='',4000);
}

requireRole('admin');
buildNav();
setUserInfo();

// Override showAlert from components.js
window.showAlert = (target, type, message) => {
    const icon = type==='success'?'bi-check-circle-fill':'bi-x-circle-fill';
    const cssType = type==='success'?'success':'error';
    document.getElementById('alertBox').innerHTML=`<div class="mh-alert ${cssType}"><i class="bi ${icon}"></i>${message}</div>`;
    setTimeout(()=>document.getElementById('alertBox').innerHTML='',4000);
};

// Search filter
$('#searchInput').on('input', function(){
    const q = this.value.toLowerCase();
    $('#tableBody tr').each(function(){
        const txt = $(this).text().toLowerCase();
        $(this).toggle(txt.includes(q));
    });
});

// Override injectNavbar from components.js (already handled above)
window.injectNavbar = () => {};
</script>
</body>
</html>
