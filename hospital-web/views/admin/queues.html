<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Antrian — MiniHospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root{--primary:#2563EB;--primary-light:#EFF6FF;--primary-mid:#DBEAFE;--success:#16A34A;--success-light:#F0FDF4;--warning:#D97706;--warning-light:#FFFBEB;--danger:#DC2626;--danger-light:#FEF2F2;--surface:#FFFFFF;--surface-2:#F8FAFC;--border:#E2E8F0;--text-primary:#0F172A;--text-secondary:#64748B;--text-muted:#94A3B8;--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.10);--radius:14px;--radius-sm:8px}
        *,*::before,*::after{box-sizing:border-box}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface-2);color:var(--text-primary);min-height:100vh}
        .mh-navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
        .brand{font-size:1.05rem;font-weight:800;color:var(--primary);letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;text-decoration:none}
        .brand-icon{width:34px;height:34px;background:var(--primary);border-radius:9px;display:grid;place-items:center;color:#fff;font-size:1rem}
        .mh-nav-links{display:flex;align-items:center;gap:2px;margin-left:2rem}
        .mh-nav-links a{font-size:0.875rem;font-weight:500;color:var(--text-secondary);text-decoration:none;padding:6px 14px;border-radius:8px;transition:all 0.15s;white-space:nowrap}
        .mh-nav-links a:hover{background:var(--surface-2);color:var(--text-primary)}
        .mh-nav-links a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
        .mh-nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
        .nav-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--primary) 0%,#60A5FA 100%);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:0.8rem;font-weight:700}
        .nav-user-name{font-size:0.875rem;font-weight:600}
        .btn-logout{font-size:0.8rem;font-weight:600;color:var(--text-secondary);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 14px;cursor:pointer;transition:all 0.15s}
        .btn-logout:hover{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}
        .page-wrapper{max-width:1280px;margin:0 auto;padding:2rem 1.5rem}
        .page-header{margin-bottom:1.5rem}
        .page-header h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;margin:0}
        .page-header p{color:var(--text-secondary);font-size:0.875rem;margin:4px 0 0}

        /* Mini stat strip */
        .stat-strip{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .strip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.25rem;flex:1;min-width:120px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
        .strip-icon{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
        .strip-val{font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;line-height:1}
        .strip-lbl{font-size:0.75rem;font-weight:600;color:var(--text-muted)}

        /* Toolbar */
        .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;flex-wrap:wrap}
        .date-input{border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:0.875rem;font-family:inherit;outline:none;background:var(--surface);cursor:pointer;transition:border-color 0.15s}
        .date-input:focus{border-color:var(--primary)}
        .btn-refresh{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:0.875rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.15s}
        .btn-refresh:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}

        /* Card + Table */
        .mh-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
        .card-head{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border)}
        .card-head h2{font-size:0.95rem;font-weight:700;margin:0}
        .mh-table{width:100%;border-collapse:collapse}
        .mh-table thead th{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:0.7rem 1rem;background:var(--surface-2);border-bottom:1px solid var(--border);text-align:left}
        .mh-table tbody td{padding:1rem;font-size:0.875rem;color:var(--text-primary);border-bottom:1px solid #F1F5F9;vertical-align:middle}
        .mh-table tbody tr:last-child td{border-bottom:none}
        .mh-table tbody tr:hover td{background:#F8FBFF}

        /* Queue number */
        .qnum{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:var(--primary-light);color:var(--primary);font-size:1rem;font-weight:800}

        /* Status badges */
        .badge-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700}
        .badge-pill.waiting{background:var(--warning-light);color:var(--warning)}
        .badge-pill.done{background:var(--success-light);color:var(--success)}
        .badge-pill.cancel{background:#F1F5F9;color:var(--text-secondary)}

        /* Action buttons */
        .btn-action{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:7px;font-size:0.78rem;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all 0.15s}
        .btn-selesai{background:var(--success-light);color:var(--success)}
        .btn-selesai:hover{background:#BBF7D0}
        .btn-batal{background:#F1F5F9;color:var(--text-secondary)}
        .btn-batal:hover{background:#E2E8F0}

        .mh-alert{padding:12px 16px;border-radius:10px;font-size:0.875rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:10px}
        .mh-alert.success{background:var(--success-light);color:var(--success);border:1px solid #BBF7D0}
        .mh-alert.error{background:var(--danger-light);color:var(--danger);border:1px solid #FECACA}
        .empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
        .empty-state i{font-size:2.5rem;display:block;margin-bottom:1rem;opacity:0.25}

        /* Live indicator */
        .live-dot{width:8px;height:8px;background:#22C55E;border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}

        @media(max-width:768px){.mh-nav-links{display:none}.page-wrapper{padding:1.25rem 1rem}.stat-strip{flex-direction:column}}
    </style>
</head>
<body>

<nav class="mh-navbar">
    <a href="dashboard.html" class="brand">
        <span class="brand-icon"><i class="bi bi-hospital"></i></span>
        MiniHospital
    </a>
    <div class="mh-nav-links" id="navLinks"></div>
    <div class="mh-nav-right">
        <div class="nav-avatar" id="navAvatar">A</div>
        <span class="nav-user-name" id="navUserName">Admin</span>
        <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div>
            <h1><i class="bi bi-clipboard2-pulse me-2" style="color:var(--primary)"></i>Monitor Antrian</h1>
            <p>Pantau dan kelola antrian pasien secara realtime</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;background:var(--success-light);color:var(--success);border:1px solid #BBF7D0;border-radius:20px;padding:6px 14px;font-size:0.8rem;font-weight:700">
            <span class="live-dot"></span> Live
        </div>
    </div>

    <!-- Stat Strip -->
    <div class="stat-strip">
        <div class="strip-card">
            <div class="strip-icon" style="background:var(--primary-light);color:var(--primary)"><i class="bi bi-people-fill"></i></div>
            <div>
                <div class="strip-val" id="statTotal">—</div>
                <div class="strip-lbl">Total Antrian</div>
            </div>
        </div>
        <div class="strip-card">
            <div class="strip-icon" style="background:var(--warning-light);color:var(--warning)"><i class="bi bi-hourglass-split"></i></div>
            <div>
                <div class="strip-val" id="statMenunggu">—</div>
                <div class="strip-lbl">Menunggu</div>
            </div>
        </div>
        <div class="strip-card">
            <div class="strip-icon" style="background:var(--success-light);color:var(--success)"><i class="bi bi-check-circle-fill"></i></div>
            <div>
                <div class="strip-val" id="statSelesai">—</div>
                <div class="strip-lbl">Selesai</div>
            </div>
        </div>
        <div class="strip-card">
            <div class="strip-icon" style="background:#F1F5F9;color:var(--text-secondary)"><i class="bi bi-x-circle-fill"></i></div>
            <div>
                <div class="strip-val" id="statBatal">—</div>
                <div class="strip-lbl">Dibatalkan</div>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <label style="font-size:0.8rem;font-weight:700;color:var(--text-secondary)">Tanggal:</label>
        <input type="date" class="date-input" id="filterTanggal">
        <button class="btn-refresh" id="btnRefresh">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>

    <div id="alertBox"></div>

    <div class="mh-card">
        <div class="card-head">
            <h2><i class="bi bi-list-ol me-2" style="color:var(--primary)"></i>Daftar Antrian</h2>
            <span style="font-size:0.8rem;color:var(--text-muted)" id="queueDateLabel">—</span>
        </div>
        <div style="overflow-x:auto">
            <table class="mh-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Pasien</th>
                        <th>Dokter</th>
                        <th>Poli</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th width="200">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="text-center py-4" style="color:var(--text-muted)">Memuat...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script>
const NAV_MENU=[{href:'dashboard.html',label:'Dashboard',key:'dashboard',icon:'bi-speedometer2'},{href:'poli.html',label:'Poli',key:'poli',icon:'bi-building-fill-cross'},{href:'doctors.html',label:'Dokter',key:'doctors',icon:'bi-person-badge'},{href:'schedules.html',label:'Jadwal',key:'schedules',icon:'bi-calendar-week'},{href:'queues.html',label:'Antrian',key:'queues',icon:'bi-list-ol'}];
const BASE_PATH='/MiniHospital/hospital-web/views/admin/';
const ACTIVE_PAGE='queues';
function buildNav(){document.getElementById('navLinks').innerHTML=NAV_MENU.map(m=>`<a href="${BASE_PATH}${m.href}" class="${m.key===ACTIVE_PAGE?'active':''}"><i class="bi ${m.icon} me-1"></i>${m.label}</a>`).join('')}
function setUserInfo(){const u=getUser();if(!u)return;document.getElementById('navUserName').textContent=u.name;document.getElementById('navAvatar').textContent=(u.name?.split(' ').map(w=>w[0]).join('').toUpperCase()||'A').substring(0,2)}
function showAlertMsg(type,msg){document.getElementById('alertBox').innerHTML=`<div class="mh-alert ${type}"><i class="bi ${type==='success'?'bi-check-circle-fill':'bi-x-circle-fill'}"></i>${msg}</div>`;setTimeout(()=>document.getElementById('alertBox').innerHTML='',4000)}
window.injectNavbar=()=>{};
window.showAlert=(target,type,message)=>showAlertMsg(type==='success'?'success':'error',message);

requireRole('admin');
buildNav();
setUserInfo();

// Set today date
const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('filterTanggal').value = todayStr;

function updateDateLabel(){
    const d = new Date(document.getElementById('filterTanggal').value + 'T00:00:00');
    document.getElementById('queueDateLabel').textContent = d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
updateDateLabel();
document.getElementById('filterTanggal').onchange = updateDateLabel;

function statusBadge(s){
    const map={menunggu:'<span class="badge-pill waiting"><i class="bi bi-clock"></i> Menunggu</span>',selesai:'<span class="badge-pill done"><i class="bi bi-check"></i> Selesai</span>',batal:'<span class="badge-pill cancel"><i class="bi bi-x"></i> Batal</span>'};
    return map[s]||s;
}
function renderActions(q){
    if(q.status!=='menunggu')return'<span style="color:var(--text-muted);font-size:0.8rem">—</span>';
    return`<button class="btn-action btn-selesai me-1" onclick="updateStatus(${q.id},'selesai')"><i class="bi bi-check-circle"></i> Selesai</button><button class="btn-action btn-batal" onclick="updateStatus(${q.id},'batal')"><i class="bi bi-x-circle"></i> Batal</button>`;
}

function loadQueues(){
    const tanggal=document.getElementById('filterTanggal').value;
    document.getElementById('tableBody').innerHTML='<tr><td colspan="7" class="text-center py-4" style="color:var(--text-muted)">Memuat...</td></tr>';
    apiCall(`/queue/today?tanggal=${tanggal}`,'GET').done(function(res){
        const data=res.data||[];
        const menunggu=data.filter(q=>q.status==='menunggu').length;
        const selesai=data.filter(q=>q.status==='selesai').length;
        const batal=data.filter(q=>q.status==='batal').length;
        document.getElementById('statTotal').textContent=res.meta?.total||data.length;
        document.getElementById('statMenunggu').textContent=menunggu;
        document.getElementById('statSelesai').textContent=selesai;
        document.getElementById('statBatal').textContent=batal;
        if(!data.length){document.getElementById('tableBody').innerHTML='<tr><td colspan="7"><div class="empty-state"><i class="bi bi-inbox"></i><p>Tidak ada antrian pada tanggal ini</p></div></td></tr>';return}
        const rows=data.map((q,i)=>`
            <tr>
                <td><span class="qnum">${q.nomor_antrian}</span></td>
                <td style="font-weight:600">${q.nama_pasien}</td>
                <td style="color:var(--text-secondary)">${q.nama_dokter}</td>
                <td><span style="font-size:0.78rem;background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:6px;font-weight:700">${q.nama_poli}</span></td>
                <td style="color:var(--text-secondary);font-size:0.82rem">${formatDate(q.tanggal)}</td>
                <td>${statusBadge(q.status)}</td>
                <td>${renderActions(q)}</td>
            </tr>`).join('');
        document.getElementById('tableBody').innerHTML=rows;
    });
}

function updateStatus(id,status){
    const label=status==='selesai'?'menandai selesai':'membatalkan';
    if(!confirm(`Yakin ${label} antrian ini?`))return;
    apiCall(`/queue/${id}/status`,'PUT',{status}).done(res=>{showAlertMsg('success',res.message);loadQueues()}).fail(xhr=>showAlertMsg('error',xhr.responseJSON?.message||'Gagal update'));
}

function formatDate(ds){if(!ds)return'-';const d=new Date(ds);return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function formatTime(ts){if(!ts)return'-';return ts.substring(0,5)}

document.getElementById('filterTanggal').onchange=()=>{updateDateLabel();loadQueues()};
document.getElementById('btnRefresh').onclick=loadQueues;
loadQueues();

// Auto-refresh setiap 30 detik
setInterval(loadQueues, 30000);
</script>
</body>
</html>
