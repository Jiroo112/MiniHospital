<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Antrian - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="navbar"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Monitoring Antrian</h3>
        <div>
            Total antrian: <span class="badge bg-primary fs-6" id="totalAntrian">0</span>
        </div>
    </div>

    <div id="alert-box"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row mb-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Tanggal</label>
                    <input type="date" id="filterTanggal" class="form-control">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-primary w-100" id="btnRefresh">Refresh</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="50">No</th>
                            <th width="100">No. Antrian</th>
                            <th>Pasien</th>
                            <th>Dokter</th>
                            <th>Poli</th>
                            <th>Tanggal</th>
                            <th>Status</th>
                            <th width="200">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" class="text-center">Memuat...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/admin-queues.js"></script>

</body>
</html>
