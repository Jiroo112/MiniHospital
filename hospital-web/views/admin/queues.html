<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Antrian — MiniHospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/admin.css" rel="stylesheet">
    <link href="../../css/admin-queues.css" rel="stylesheet">
</head>
<body>

<nav class="mh-navbar">
    <a href="dashboard.html" class="brand">
        <span class="brand-icon"><i class="bi bi-hospital"></i></span>
        MiniHospital
    </a>
    <div class="mh-nav-links" id="navLinks"></div>
    <div class="mh-nav-right">
        <div class="nav-avatar" id="navAvatar">A</div>
        <span class="nav-user-name" id="navUserName">Admin</span>
        <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div>
            <h1><i class="bi bi-clipboard2-pulse me-2 icon-primary"></i>Monitor Antrian</h1>
            <p>Pantau dan kelola antrian pasien secara realtime</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;background:var(--success-light);color:var(--success);border:1px solid #BBF7D0;border-radius:20px;padding:6px 14px;font-size:0.8rem;font-weight:700">
            <span class="live-dot"></span> Live
        </div>
    </div>

    <div class="stat-strip">
        <div class="strip-card">
            <div class="strip-icon" style="background:var(--primary-light);color:var(--primary)"><i class="bi bi-people-fill"></i></div>
            <div><div class="strip-val" id="statTotal">—</div><div class="strip-lbl">Total Antrian</div></div>
        </div>
        <div class="strip-card">
            <div class="strip-icon" style="background:var(--warning-light);color:var(--warning)"><i class="bi bi-hourglass-split"></i></div>
            <div><div class="strip-val" id="statMenunggu">—</div><div class="strip-lbl">Menunggu</div></div>
        </div>
        <div class="strip-card">
            <div class="strip-icon" style="background:var(--success-light);color:var(--success)"><i class="bi bi-check-circle-fill"></i></div>
            <div><div class="strip-val" id="statSelesai">—</div><div class="strip-lbl">Selesai</div></div>
        </div>
        <div class="strip-card">
            <div class="strip-icon" style="background:#F1F5F9;color:var(--text-secondary)"><i class="bi bi-x-circle-fill"></i></div>
            <div><div class="strip-val" id="statBatal">—</div><div class="strip-lbl">Dibatalkan</div></div>
        </div>
    </div>

    <div class="toolbar">
        <label style="font-size:0.8rem;font-weight:700;color:var(--text-secondary)">Tanggal:</label>
        <input type="date" class="date-input" id="filterTanggal">
        <button class="btn-refresh" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>

    <div id="alertBox"></div>

    <div class="mh-card">
        <div class="card-head">
            <h2><i class="bi bi-list-ol me-2 icon-primary"></i>Daftar Antrian</h2>
            <span style="font-size:0.8rem;color:var(--text-muted)" id="queueDateLabel">—</span>
        </div>
        <div style="overflow-x:auto">
            <table class="mh-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Pasien</th>
                        <th>Dokter</th>
                        <th>Poli</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th width="200">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="text-center py-4" style="color:var(--text-muted)">Memuat...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/pages/admin-queues.js"></script>
</body>
</html>
