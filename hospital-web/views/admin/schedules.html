<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Dokter — MiniHospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root{--primary:#2563EB;--primary-light:#EFF6FF;--primary-mid:#DBEAFE;--success:#16A34A;--success-light:#F0FDF4;--warning:#D97706;--warning-light:#FFFBEB;--danger:#DC2626;--danger-light:#FEF2F2;--surface:#FFFFFF;--surface-2:#F8FAFC;--border:#E2E8F0;--text-primary:#0F172A;--text-secondary:#64748B;--text-muted:#94A3B8;--shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.10);--radius:14px;--radius-sm:8px}
        *,*::before,*::after{box-sizing:border-box}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface-2);color:var(--text-primary);min-height:100vh}
        .mh-navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
        .brand{font-size:1.05rem;font-weight:800;color:var(--primary);letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;text-decoration:none}
        .brand-icon{width:34px;height:34px;background:var(--primary);border-radius:9px;display:grid;place-items:center;color:#fff;font-size:1rem}
        .mh-nav-links{display:flex;align-items:center;gap:2px;margin-left:2rem}
        .mh-nav-links a{font-size:0.875rem;font-weight:500;color:var(--text-secondary);text-decoration:none;padding:6px 14px;border-radius:8px;transition:all 0.15s;white-space:nowrap}
        .mh-nav-links a:hover{background:var(--surface-2);color:var(--text-primary)}
        .mh-nav-links a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
        .mh-nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
        .nav-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--primary) 0%,#60A5FA 100%);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:0.8rem;font-weight:700}
        .nav-user-name{font-size:0.875rem;font-weight:600}
        .btn-logout{font-size:0.8rem;font-weight:600;color:var(--text-secondary);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 14px;cursor:pointer;transition:all 0.15s}
        .btn-logout:hover{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}
        .page-wrapper{max-width:1280px;margin:0 auto;padding:2rem 1.5rem}
        .page-header{margin-bottom:1.5rem}
        .page-header h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;margin:0}
        .page-header p{color:var(--text-secondary);font-size:0.875rem;margin:4px 0 0}
        .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;flex-wrap:wrap}
        .select-filter{border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:0.875rem;font-family:inherit;outline:none;background:var(--surface);cursor:pointer;transition:border-color 0.15s;min-width:180px}
        .select-filter:focus{border-color:var(--primary)}
        .btn-primary-mh{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:0.875rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s}
        .btn-primary-mh:hover{background:#1D4ED8;box-shadow:0 4px 12px rgba(37,99,235,0.35)}
        .mh-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
        .mh-table{width:100%;border-collapse:collapse}
        .mh-table thead th{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:0.7rem 1rem;background:var(--surface-2);border-bottom:1px solid var(--border);text-align:left}
        .mh-table tbody td{padding:1rem;font-size:0.875rem;color:var(--text-primary);border-bottom:1px solid #F1F5F9;vertical-align:middle}
        .mh-table tbody tr:last-child td{border-bottom:none}
        .mh-table tbody tr:hover td{background:#F8FBFF}

        /* Day badges */
        .day-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:700}
        .day-Senin    {background:#EFF6FF;color:#2563EB}
        .day-Selasa   {background:#F0FDF4;color:#16A34A}
        .day-Rabu     {background:#FFFBEB;color:#D97706}
        .day-Kamis    {background:#FEF2F2;color:#DC2626}
        .day-Jumat    {background:#F5F3FF;color:#7C3AED}
        .day-Sabtu    {background:#FFF7ED;color:#EA580C}
        .day-Minggu   {background:#FDF2F8;color:#DB2777}

        .time-wrap{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:0.85rem;font-weight:600}
        .time-sep{color:var(--text-muted);font-size:0.75rem}

        .btn-action{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:7px;font-size:0.78rem;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all 0.15s}
        .btn-edit{background:var(--warning-light);color:var(--warning)}
        .btn-edit:hover{background:#FDE68A}
        .btn-del{background:var(--danger-light);color:var(--danger)}
        .btn-del:hover{background:#FECACA}

        .mh-modal .modal-content{border:none;border-radius:var(--radius);box-shadow:var(--shadow-lg)}
        .mh-modal .modal-header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.25rem 1.5rem}
        .mh-modal .modal-header h5{font-weight:800;font-size:1rem;margin:0}
        .mh-modal .modal-body{padding:1.5rem}
        .mh-modal .modal-footer{border-top:1px solid var(--border);padding:1rem 1.5rem;gap:10px}
        .form-label{font-size:0.8rem;font-weight:700;color:var(--text-secondary);margin-bottom:5px}
        .form-control,.form-select{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:0.875rem;font-family:inherit;outline:none;transition:border-color 0.15s;width:100%}
        .form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
        .mh-alert{padding:12px 16px;border-radius:10px;font-size:0.875rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:10px}
        .mh-alert.success{background:var(--success-light);color:var(--success);border:1px solid #BBF7D0}
        .mh-alert.error{background:var(--danger-light);color:var(--danger);border:1px solid #FECACA}
        .empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
        .empty-state i{font-size:2.5rem;display:block;margin-bottom:1rem;opacity:0.25}

        @media(max-width:768px){.mh-nav-links{display:none}.page-wrapper{padding:1.25rem 1rem}}
    </style>
</head>
<body>

<nav class="mh-navbar">
    <a href="dashboard.html" class="brand">
        <span class="brand-icon"><i class="bi bi-hospital"></i></span>
        MiniHospital
    </a>
    <div class="mh-nav-links" id="navLinks"></div>
    <div class="mh-nav-right">
        <div class="nav-avatar" id="navAvatar">A</div>
        <span class="nav-user-name" id="navUserName">Admin</span>
        <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header">
        <h1><i class="bi bi-calendar-week me-2" style="color:var(--primary)"></i>Jadwal Dokter</h1>
        <p>Atur jadwal praktik dokter per hari dan jam</p>
    </div>

    <div class="toolbar">
        <select class="select-filter" id="filterDokter">
            <option value="">Semua Dokter</option>
        </select>
        <div style="margin-left:auto">
            <button class="btn-primary-mh" id="btnTambah">
                <i class="bi bi-plus-circle-fill"></i> Tambah Jadwal
            </button>
        </div>
    </div>

    <div id="alertBox"></div>

    <div class="mh-card">
        <div style="overflow-x:auto">
            <table class="mh-table">
                <thead>
                    <tr>
                        <th width="44">No</th>
                        <th>Dokter</th>
                        <th>Hari</th>
                        <th>Jam Praktik</th>
                        <th width="160">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="text-center py-4" style="color:var(--text-muted)">Memuat...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade mh-modal" id="scheduleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formSchedule">
                <div class="modal-header">
                    <h5 id="modalTitle">Tambah Jadwal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <div class="mb-3">
                        <label class="form-label">Dokter *</label>
                        <select name="dokter_id" class="form-select" required>
                            <option value="">-- Pilih Dokter --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hari *</label>
                        <select name="hari" class="form-select" required>
                            <option value="">-- Pilih Hari --</option>
                            <option>Senin</option><option>Selasa</option><option>Rabu</option>
                            <option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Jam Mulai *</label>
                            <input type="time" name="jam_mulai" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Jam Selesai *</label>
                            <input type="time" name="jam_selesai" class="form-control" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn-primary-mh"><i class="bi bi-save me-1"></i>Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/pages/admin-schedules.js"></script>
<script>
const NAV_MENU=[{href:'dashboard.html',label:'Dashboard',key:'dashboard',icon:'bi-speedometer2'},{href:'poli.html',label:'Poli',key:'poli',icon:'bi-building-fill-cross'},{href:'doctors.html',label:'Dokter',key:'doctors',icon:'bi-person-badge'},{href:'schedules.html',label:'Jadwal',key:'schedules',icon:'bi-calendar-week'},{href:'queues.html',label:'Antrian',key:'queues',icon:'bi-list-ol'}];
const BASE_PATH='/MiniHospital/hospital-web/views/admin/';
const ACTIVE_PAGE='schedules';
function buildNav(){document.getElementById('navLinks').innerHTML=NAV_MENU.map(m=>`<a href="${BASE_PATH}${m.href}" class="${m.key===ACTIVE_PAGE?'active':''}"><i class="bi ${m.icon} me-1"></i>${m.label}</a>`).join('')}
function setUserInfo(){const u=getUser();if(!u)return;document.getElementById('navUserName').textContent=u.name;document.getElementById('navAvatar').textContent=(u.name?.split(' ').map(w=>w[0]).join('').toUpperCase()||'A').substring(0,2)}
window.injectNavbar=()=>{};
window.showAlert=(target,type,message)=>{
    const t=type==='success'?'success':'error';
    document.getElementById('alertBox').innerHTML=`<div class="mh-alert ${t}"><i class="bi ${t==='success'?'bi-check-circle-fill':'bi-x-circle-fill'}"></i>${message}</div>`;
    setTimeout(()=>document.getElementById('alertBox').innerHTML='',4000);
};

requireRole('admin');
buildNav();
setUserInfo();

// Override loadSchedules row rendering to use new badges
const _origLoad = window.loadSchedules;
$(function(){
    // Patch table render after page load
    const origLoadSchedules = loadSchedules;
    window.loadSchedules = function(){
        const dokterId=$('#filterDokter').val();
        const endpoint=dokterId?`/schedules?dokter_id=${dokterId}`:'/schedules';
        $('#tableBody').html('<tr><td colspan="5" class="text-center py-4" style="color:var(--text-muted)">Memuat...</td></tr>');
        apiCall(endpoint,'GET').done(function(res){
            if(!res.data||!res.data.length){
                $('#tableBody').html('<tr><td colspan="5"><div class="empty-state"><i class="bi bi-calendar-x"></i><p>Belum ada jadwal</p></div></td></tr>');
                return;
            }
            const rows=res.data.map((s,i)=>`
                <tr>
                    <td style="color:var(--text-muted);font-weight:600">${i+1}</td>
                    <td>
                        <div style="font-weight:700">${s.nama_dokter}</div>
                        <div style="font-size:0.78rem;color:var(--text-muted)">${s.spesialis||''}</div>
                    </td>
                    <td><span class="day-badge day-${s.hari}"><i class="bi bi-calendar3 me-1"></i>${s.hari}</span></td>
                    <td>
                        <div class="time-wrap">
                            <i class="bi bi-clock"></i>
                            ${formatTime(s.jam_mulai)}
                            <span class="time-sep">→</span>
                            ${formatTime(s.jam_selesai)}
                        </div>
                    </td>
                    <td>
                        <button class="btn-action btn-edit me-1" onclick="openEditModal(${s.id})"><i class="bi bi-pencil"></i> Edit</button>
                        <button class="btn-action btn-del" onclick="hapusSchedule(${s.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`).join('');
            $('#tableBody').html(rows);
        });
    };
    loadSchedules();
});
</script>
</body>
</html>
