<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian Pasien - Dokter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/dokter.css" rel="stylesheet">
    <link href="../../css/dokter-antrian.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="page-header">
        <h4>Antrian Pasien Hari Ini</h4>
        <p id="tanggalHeader">Memuat...</p>
    </div>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card card-blue h-100">
                <span class="si">📋</span>
                <div class="sv" id="totalAntrian">–</div>
                <div class="sl">Total Antrian</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-yellow h-100">
                <span class="si">⏳</span>
                <div class="sv" id="statMenunggu">–</div>
                <div class="sl">Menunggu</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-green h-100">
                <span class="si">✅</span>
                <div class="sv" id="statSelesai">–</div>
                <div class="sl">Selesai</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-gray h-100">
                <span class="si">❌</span>
                <div class="sv" id="statBatal">–</div>
                <div class="sl">Batal</div>
            </div>
        </div>
    </div>

    <!-- Tabel Antrian -->
    <div class="section-card">
        <div class="section-header">
            <h6 class="section-title">🏥 Daftar Antrian</h6>
            <span class="badge-refresh" id="pollingStatus">🟢 Auto-refresh 5 detik</span>
        </div>

        <div class="filter-bar">
            <label>Tanggal</label>
            <input type="date" id="filterTanggal">
            <button class="btn btn-sm btn-outline-primary" id="btnRefresh"
                style="border-radius:8px;font-size:0.82rem">
                Refresh
            </button>
            <span class="ms-auto update-info">
                Update terakhir: <span id="lastUpdate">–</span>
            </span>
        </div>

        <div id="alert-box" class="alert alert-success"></div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>No. Antrian</th>
                        <th>Pasien</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6">
                        <div class="empty-state">
                            <div class="ei">⏳</div>
                            <div>Memuat antrian...</div>
                        </div>
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/dokter-antrian.js"></script>

</body>
</html>
