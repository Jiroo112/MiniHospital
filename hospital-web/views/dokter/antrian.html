<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Antrian Pasien - Dokter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="navbar"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Antrian Pasien Hari Ini</h3>
        <div id="pollingStatus"></div>
    </div>

    <div id="alert-box"></div>

    <!-- Statistik Kartu -->
    <div class="row mb-3">
        <div class="col-md-3">
            <div class="card text-bg-primary">
                <div class="card-body text-center">
                    <h2 class="mb-0" id="totalAntrian">0</h2>
                    <small>Total Antrian</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-warning">
                <div class="card-body text-center">
                    <h2 class="mb-0" id="statMenunggu">0</h2>
                    <small>Menunggu</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-success">
                <div class="card-body text-center">
                    <h2 class="mb-0" id="statSelesai">0</h2>
                    <small>Selesai</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-secondary">
                <div class="card-body text-center">
                    <h2 class="mb-0" id="statBatal">0</h2>
                    <small>Batal</small>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row mb-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Tanggal</label>
                    <input type="date" id="filterTanggal" class="form-control">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-primary w-100" id="btnRefresh">Refresh Manual</button>
                </div>
                <div class="col-md-6 text-end">
                    <small class="text-muted">Update terakhir: <span id="lastUpdate">-</span></small>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="50">No</th>
                            <th width="120">No. Antrian</th>
                            <th>Pasien</th>
                            <th>Tanggal</th>
                            <th>Status</th>
                            <th width="220">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" class="text-center">Memuat...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/dokter-antrian.js"></script>

</body>
</html>
