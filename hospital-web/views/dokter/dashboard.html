<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dokter - Mini Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/dokter.css" rel="stylesheet">
    <link href="../../css/dokter-dashboard.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">

    <!-- Welcome Banner -->
    <div class="welcome-banner mb-4">
        <h4>Selamat Datang, <span id="userName">Dokter</span>! 👋</h4>
        <p id="tanggalHariIni"></p>
    </div>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card card-total h-100">
                <span class="stat-icon">📋</span>
                <div class="stat-value" id="statTotal">–</div>
                <div class="stat-label">Total Antrian</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-menunggu h-100">
                <span class="stat-icon">⏳</span>
                <div class="stat-value" id="statMenunggu">–</div>
                <div class="stat-label">Menunggu</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-selesai h-100">
                <span class="stat-icon">✅</span>
                <div class="stat-value" id="statSelesai">–</div>
                <div class="stat-label">Selesai</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-jadwal h-100">
                <span class="stat-icon">📅</span>
                <div class="stat-value" id="statJadwal">–</div>
                <div class="stat-label">Jadwal Aktif</div>
            </div>
        </div>
    </div>

    <!-- Content Row -->
    <div class="row g-4">

        <!-- Antrian Hari Ini -->
        <div class="col-lg-7">
            <div class="section-card h-100">
                <div class="section-header">
                    <h6 class="section-title">🏥 Antrian Hari Ini</h6>
                    <span class="badge-refresh">🟢 Auto-refresh 5 detik</span>
                </div>
                <div id="flash-alert" class="alert alert-success"></div>
                <div id="antrianList">
                    <div class="empty-state">
                        <div class="ei">⏳</div>
                        <div>Memuat antrian...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Jadwal Praktik -->
        <div class="col-lg-5">
            <div class="section-card h-100">
                <div class="section-header">
                    <h6 class="section-title">📅 Jadwal Praktik Saya</h6>
                </div>
                <div id="jadwalList">
                    <div class="empty-state">
                        <div class="ei">📅</div>
                        <div>Memuat jadwal...</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/dashboard-dokter.js"></script>

</body>
</html>
