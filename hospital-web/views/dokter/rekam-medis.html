<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekam Medis - Dokter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/dokter.css" rel="stylesheet">
    <link href="../../css/dokter-rekam-medis.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="page-header">
        <h4>Input Rekam Medis</h4>
        <p>Catat diagnosa, tindakan, dan resep untuk pasien</p>
    </div>

    <div id="alert-box"></div>

    <div class="row g-4">

        <!-- Form Input -->
        <div class="col-lg-5">
            <div class="section-card">
                <div class="section-header">
                    <h6 class="section-title">📝 Form Rekam Medis</h6>
                    <span id="namaPasienTag"></span>
                </div>
                <div class="form-body">
                    <form id="formRekamMedis">

                        <div class="mb-3">
                            <label class="form-label">Pasien ID <span class="text-danger">*</span></label>
                            <input type="number" name="pasien_id" class="form-control"
                                placeholder="Contoh: 3" required>
                            <div class="mt-1" style="font-size:0.78rem;color:#94a3b8">
                                Lihat ID pasien di halaman Antrian
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Diagnosa <span class="text-danger">*</span></label>
                            <textarea name="diagnosa" class="form-control"
                                placeholder="Masukkan diagnosa..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tindakan</label>
                            <textarea name="tindakan" class="form-control"
                                placeholder="Tindakan medis yang dilakukan..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Resep</label>
                            <textarea name="resep" class="form-control"
                                placeholder="Resep obat..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Catatan</label>
                            <textarea name="catatan" class="form-control"
                                placeholder="Catatan tambahan..."></textarea>
                        </div>

                        <button type="submit" class="btn-simpan" id="btnSimpan">
                            💾 Simpan Rekam Medis
                        </button>

                    </form>
                </div>
            </div>
        </div>

        <!-- Riwayat Rekam Medis -->
        <div class="col-lg-7">
            <div class="section-card h-100">
                <div class="section-header">
                    <h6 class="section-title">🗂️ Rekam Medis Sesi Ini</h6>
                    <span style="font-size:0.75rem;color:#94a3b8" id="jumlahRekam"></span>
                </div>
                <div id="rekamList">
                    <div class="empty-state">
                        <div class="ei">📋</div>
                        <div>Memuat data rekam medis...</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/dokter-rekam-medis.js"></script>

</body>
</html>
