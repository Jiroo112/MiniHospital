<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Mini Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../css/auth.css" rel="stylesheet">
    <link href="../../css/auth-register.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
    <div class="brand">
        <div class="brand-icon">🏥</div>
        <h2>Mini Hospital</h2>
        <p>Buat akun pasien baru</p>
    </div>

    <div class="auth-card">
        <h5>Daftar Akun Pasien</h5>

        <div id="alert-box"></div>

        <form id="formRegister">

            <div class="section-divider">Informasi Akun</div>

            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" name="name" class="form-control"
                    placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Alamat Email</label>
                <input type="email" name="email" class="form-control"
                    placeholder="contoh@email.com" required>
            </div>

            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control"
                        placeholder="Min. 6 karakter" minlength="6" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Konfirmasi Password</label>
                    <input type="password" name="password_confirm" class="form-control"
                        placeholder="Ulangi password" minlength="6" required>
                </div>
            </div>

            <div class="section-divider">Data Pasien</div>

            <div class="mb-3">
                <label class="form-label">Alamat</label>
                <textarea name="alamat" class="form-control"
                    placeholder="Alamat lengkap..."></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Tanggal Lahir</label>
                <input type="date" name="tanggal_lahir" class="form-control">
            </div>

            <button type="submit" class="btn-register" id="btnRegister">
                Buat Akun
            </button>

        </form>
    </div>

    <div class="auth-footer">
        Sudah punya akun?
        <a href="login.html">Masuk di sini</a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/pages/register.js"></script>

</body>
</html>
