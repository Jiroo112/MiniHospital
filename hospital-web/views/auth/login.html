<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mini Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1d4ed8 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .login-wrapper {
            width: 100%; max-width: 440px; padding: 20px;
        }
        .brand {
            text-align: center; margin-bottom: 28px;
        }
        .brand-icon {
            width: 64px; height: 64px; background: #3b82f6;
            border-radius: 18px; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 14px;
            font-size: 2rem; box-shadow: 0 8px 24px rgba(59,130,246,0.4);
        }
        .brand h2 { color: #fff; font-weight: 700; font-size: 1.5rem; margin: 0; }
        .brand p  { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin: 4px 0 0; }

        .login-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px; padding: 32px;
        }
        .login-card h5 {
            color: #fff; font-weight: 700; font-size: 1.1rem;
            margin: 0 0 24px;
        }
        .form-label {
            color: rgba(255,255,255,0.7); font-size: 0.82rem;
            font-weight: 600; margin-bottom: 6px;
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff;
            padding: 10px 14px; font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
            color: #fff; outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; border-radius: 10px; color: #fff;
            padding: 11px; font-size: 0.95rem; font-weight: 600;
            width: 100%; cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            box-shadow: 0 4px 16px rgba(37,99,235,0.4);
        }
        .btn-login:hover  { opacity: 0.9; transform: translateY(-1px); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .login-footer {
            text-align: center; margin-top: 20px;
            color: rgba(255,255,255,0.5); font-size: 0.85rem;
        }
        .login-footer a { color: #60a5fa; text-decoration: none; font-weight: 600; }
        .login-footer a:hover { color: #93c5fd; }

        #alert-box { margin-bottom: 18px; }
        #alert-box .alert {
            border-radius: 10px; font-size: 0.85rem;
            border: none; padding: 10px 14px;
        }
        .alert-danger  { background: rgba(239,68,68,0.2);  color: #fca5a5; }
        .alert-success { background: rgba(16,185,129,0.2); color: #6ee7b7; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="brand">
        <div class="brand-icon">🏥</div>
        <h2>Mini Hospital</h2>
        <p>Sistem Informasi Rumah Sakit</p>
    </div>

    <div class="login-card">
        <h5>Masuk ke Akun Anda</h5>

        <div id="alert-box"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">Alamat Email</label>
                <input type="email" name="email" class="form-control"
                    placeholder="contoh@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                    placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                Masuk
            </button>
        </form>
    </div>

    <div class="login-footer">
        Belum punya akun?
        <a href="register.html">Daftar sebagai pasien</a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/pages/login.js"></script>

</body>
</html>
